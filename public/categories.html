<!DOCTYPE html>
<html lang="es">
<!-- Build: 2026-02-03T00:01 -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - Import.cba Mayorista</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            max-width: 300px;
            height: auto;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: #4a5568;
            font-size: 1.1rem;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .category-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .category-card:hover::before {
            transform: scaleX(1);
        }

        .category-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .category-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .social-link {
            color: #4a5568;
            transition: transform 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-link:hover {
            transform: scale(1.1);
        }

        .social-link svg {
            width: 32px;
            height: 32px;
        }

        .social-link.instagram:hover {
            color: #E1306C;
        }

        .social-link.facebook:hover {
            color: #1877F2;
        }

        .social-link.tiktok:hover {
            color: #000000;
        }

        .social-link.whatsapp:hover {
            color: #25D366;
        }

        .category-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .category-subtitle {
            font-size: 0.9rem;
            color: #718096;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .categories-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .category-card {
                padding: 20px;
            }

            .category-icon {
                font-size: 2.5rem;
            }

            .category-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="logo.png" alt="Import.cba Mayorista" class="logo">
            <h1>Catalogo Mayorista</h1>
            <p>Selecciona una categoria para ver los productos</p>
            <div id="social-links-container" class="social-links"></div>
            <div id="admin-link-container"></div>
        </div>
        <div id="content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Cargando categorias...</p>
            </div>
        </div>
    </div>
    <script>
        var categoryIcons = {
            'LIBRERIA': '📚',
            'JUGUETERIA': '🧸',
            'BAZAR': '🏠',
            'FERRETERIA': '🔧',
            'ELECTRONICA': '💻',
            'INDUMENTARIA': '👕',
            'BELLEZA': '💄',
            'NAVIDAD': '🎄',
            'BIJOUTERIE': '💎',
            'TELEFONIA': '📱',
            'DEFAULT': '📦'
        };

        async function loadCategories() {
            try {
                var response = await fetch('/api/categories');
                if (!response.ok) throw new Error('Error al cargar categorias');
                var data = await response.json();
                var categories = data.categories || [];
                if (categories.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="error"><h2>No se encontraron categorias</h2></div>';
                    return;
                }
                renderCategories(categories);
            } catch (error) {
                document.getElementById('content').innerHTML = '<div class="error"><h2>Error al cargar categorias</h2><p>' + error.message + '</p></div>';
            }
        }

        function renderCategories(categories) {
            var grid = '';
            for (var i = 0; i < categories.length; i++) {
                var cat = categories[i];
                var icon = categoryIcons[cat.toUpperCase()] || categoryIcons['DEFAULT'];
                var cleanName = cat.charAt(0).toUpperCase() + cat.slice(1).toLowerCase();
                var url = '/catalog?category=' + encodeURIComponent(cat);
                grid += '<a href="' + url + '" class="category-card" style="text-decoration:none;">';
                grid += '<div class="category-icon">' + icon + '</div>';
                grid += '<div class="category-name">' + cleanName + '</div>';
                grid += '<div class="category-subtitle">Ver productos</div>';
                grid += '</a>';
            }
            document.getElementById('content').innerHTML = '<div class="categories-grid">' + grid + '</div>';
        }

        loadCategories();

        // Show admin link if logged in
        document.addEventListener('DOMContentLoaded', () => {
            const token = sessionStorage.getItem('admin_token');
            if (token) {
                const container = document.getElementById('admin-link-container');
                if (container) {
                    const link = document.createElement('a');
                    link.href = '/config.html';
                    link.title = 'Acceso Administrador';
                    link.style.cssText = 'display: inline-block; margin-top: 15px; color: #cbd5e0; text-decoration: none; font-size: 1.2rem; transition: color 0.3s;';
                    link.innerHTML = '⚙️';
                    container.appendChild(link);
                }
            }

            // Load Social Icons
            fetch('/api/config')
                .then(res => res.json())
                .then(config => {
                    if (config.global) {
                        const container = document.getElementById('social-links-container');
                        const social = [
                            {
                                key: 'SOCIAL_INSTAGRAM',
                                class: 'instagram',
                                icon: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>'
                            },
                            {
                                key: 'SOCIAL_FACEBOOK',
                                class: 'facebook',
                                icon: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>'
                            },
                            {
                                key: 'SOCIAL_TIKTOK',
                                class: 'tiktok',
                                icon: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path></svg>'
                            },
                            {
                                key: 'SOCIAL_WHATSAPP',
                                class: 'whatsapp',
                                icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.996 0A12.003 12.003 0 0 0 0 12.002c0 2.128.556 4.204 1.623 6.035L.23 23.774l5.882-1.543A11.968 11.968 0 0 0 11.996 24c6.619 0 11.996-5.378 11.996-12.002A12.003 12.003 0 0 0 11.996 0zm0 21.986c-1.801 0-3.565-.484-5.112-1.402l-.367-.216-3.8.997 1.015-3.708-.238-.378A9.975 9.975 0 0 1 2.016 12.002C2.016 6.494 6.502 2.012 11.994 2.012c2.671 0 5.176 1.041 7.062 2.929a9.907 9.907 0 0 1 2.925 7.061c0 5.508-4.486 9.984-9.985 9.984zm5.485-7.485c-.3-.151-1.775-.877-2.049-.978-.274-.101-.476-.151-.676.151-.2.302-.776.978-.951 1.179-.175.201-.35.226-.65.075-1.492-.74-2.617-1.488-3.605-3.21-.097-.17-.008-.266.067-.341.067-.067.151-.176.226-.264.075-.088.099-.151.149-.251.05-.101.025-.188-.013-.264-.176-.452-.676-1.631-.926-2.233-.243-.588-.49-.508-.676-.517-.175-.008-.376-.008-.576-.008-.2 0-.526.075-.801.376-.275.301-1.051 1.028-1.051 2.507s1.076 2.909 1.226 3.109c.15.201 2.122 3.238 5.14 4.538 1.936.83 2.597.915 3.393.864.646-.041 2.049-.838 2.338-1.646.289-.808.289-1.5.201-1.646-.088-.146-.326-.226-.626-.376z"/></svg>'
                            }
                        ];

                        social.forEach(s => {
                            const url = config.global[s.key];
                            if (url) {
                                const a = document.createElement('a');
                                // Format WhatsApp url correctly
                                a.href = s.key === 'SOCIAL_WHATSAPP'
                                    ? 'https://wa.me/' + url.replace(/[^0-9]/g, '')
                                    : url;
                                a.target = '_blank';
                                a.className = `social-link ${s.class}`;
                                a.innerHTML = s.icon;
                                container.appendChild(a);
                            }
                        });
                    }
                })
                .catch(err => console.error('Error loading social config', err));
        });
    </script>
</body>

</html>
